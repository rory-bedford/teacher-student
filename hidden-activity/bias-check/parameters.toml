# Parameters for the bias check — INFERENCE ONLY, no training.
#
# Physiology, synapses and hyperparameters are identical to
# hidden-activity/increasing-hidden-fraction so that the loss computed here is
# directly comparable to the loss logged during that grid search.
#
# The perturbation, the hidden/visible split and the correct (target) scaling
# factors are NOT regenerated here — they are read from each training run's
# `targets/` directory, so the network is bit-identical to the one that was
# trained. `simulation.seed` / `simulation.hidden_cell_fraction` are therefore
# unused and kept only to document the setup they came from.

# ========================
# SIMULATION CONFIGURATION
# ========================

[simulation]
seed = 44
chunk_size = 250
hidden_cell_fraction = 0.5

# ==========
# BIAS CHECK
# ==========

[bias_check]
# Batch elements of the teacher data to evaluate on (0 = all).
eval_batch_size = 0
# Chunks used for the loss, after burn-in (0 = all remaining).
n_eval_chunks = 0

# ======================
# TRAINING CONFIGURATION
# ======================

[training]
chunks_per_update = 8
log_interval = 4
checkpoint_interval = 40
plot_size = 40
mixed_precision = true
weight_perturbation_variance = 0.5
optimisable = "scaling_factors"
burn_in_chunks = 20

# ===============
# HYPERPARAMETERS
# ===============

[hyperparameters]
beta1 = 0.95
beta2 = 0.999
grad_norm_clip = 10.0
surrgrad_scale = 0.5
learning_rate = 1e-2
lr_min = 1e-3
van_rossum_tau_rise = 10.0
van_rossum_tau_decay = 100.0
loss_weight.van_rossum = 1.0
loss_weight.firing_rate = 10.0
loss_weight.silence_penalty = 100.0

# ==========================
# FEEDFORWARD LAYER SYNAPSES
# ==========================

[feedforward.cell_types]
names = ["mitral"]

[feedforward.synapses.mitral]
names = ["AMPA", "NMDA"]
tau_rise = [0.1, 10.0]
tau_decay = [5.0, 70.0]
E_syn = [0.0, 0.0]
g_bar = [6.0, 0.1]
g_clip = [40.0, 4.0]

# =======================================
# RECURRENT LAYER PHYSIOLOGY AND SYNAPSES
# =======================================

[recurrent.cell_types]
names = ["excitatory", "inhibitory"]

[recurrent.physiology.excitatory]
tau_mem = 85.0
theta = -38.0
U_reset = -60.0
E_L = -60.0
g_L = 1.35
tau_ref = 8.0

[recurrent.synapses.excitatory]
names = ["AMPA", "NMDA"]
tau_rise = [0.1, 10.0]
tau_decay = [5.0, 60.0]
E_syn = [0.0, 0.0]
g_bar = [4.0, 0.5]
g_clip = [40.0, 4.0]

[recurrent.physiology.inhibitory]
tau_mem = 50.0
theta = -45.0
U_reset = -60.0
E_L = -60.0
g_L = 0.9
tau_ref = 8.0

[recurrent.synapses.inhibitory]
names = ["GABA_A"]
tau_rise = [0.5]
tau_decay = [6.0]
E_syn = [-70.0]
g_bar = [8.0]
g_clip = [80.0]

# ========================
# SCALING FACTORS
# ========================

[scaling_factors]
recurrent = [
    [1.0, 1.0],
    [1.0, 1.0],
]
feedforward = [
    [1.0, 1.0],
]
