# Parameters for inferring-inputs/learn-ff-connectivity training.
# Feedforward inputs are actual mitral cell spike trains (not latents).
# The network learns a low-rank FF weight matrix from scratch while
# simultaneously recovering perturbed recurrent scaling factors.

# ========================
# SIMULATION CONFIGURATION
# ========================

[simulation]
seed = 44
chunk_size = 250

# ======================
# TRAINING CONFIGURATION
# ======================

[training]
chunks_per_update = 8
log_interval = 4
checkpoint_interval = 40
plot_size = 40
mixed_precision = true
weight_perturbation_variance = 0.5
burn_in_chunks = 20
#recurrent_smoothing_tau = 100.0

# ===============
# HYPERPARAMETERS
# ===============

[hyperparameters]
beta1 = 0.95
beta2 = 0.999
van_rossum_tau_rise = 10.0
van_rossum_tau_decay = 100.0
loss_weight.van_rossum = 1.0
ff_rank = 10

# ==========================================
# PHASE 1: CMA-ES (Gradient-Free Search)
# ==========================================
# Search over 6 params: 4 recurrent scaling factors + 2 FF weight constants

[cma_es]
n_chunks = 35
initial_sigma = 0.1
max_evaluations = 200
popsize = 10
batch_size = 1
seed = 44

# ==========================================
# PHASE 2: Gradient on Scaling Factors Only
# ==========================================
# 6 params: FF scaling (1x2) + recurrent scaling (2x2)
# Surrgrad annealing happens here only.

[phase2]
epochs = 50
surrgrad_scale = 10.0
surrgrad_scale_final = 20.0
lr_scaling = 5e-2
lr_min_scaling = 1e-3
grad_clip_scaling = 10

# ==========================================
# PHASE 3: Low-Rank FF Weights + Scaling
# ==========================================

[phase3]
epochs = 200
surrgrad_scale = 10.0
lr_weights = 1e-3
lr_scaling = 1e-4
lr_min_weights = 1e-4
lr_min_scaling = 1e-5
grad_clip_weights = 100.0
grad_clip_scaling = 0.5

# ==========================
# FEEDFORWARD LAYER SYNAPSES
# ==========================

[feedforward.cell_types]
names = ["mitral"]

[feedforward.synapses.mitral]
names = ["AMPA", "NMDA"]
tau_rise = [0.1, 10.0]
tau_decay = [5.0, 70.0]
E_syn = [0.0, 0.0]
g_bar = [6.0, 0.1]
g_clip = [40.0, 4.0]

# =======================================
# RECURRENT LAYER PHYSIOLOGY AND SYNAPSES
# =======================================

[recurrent.cell_types]
names = ["excitatory", "inhibitory"]

[recurrent.physiology.excitatory]
tau_mem = 85.0
theta = -38.0
U_reset = -60.0
E_L = -60.0
g_L = 1.35
tau_ref = 8.0

[recurrent.synapses.excitatory]
names = ["AMPA", "NMDA"]
tau_rise = [0.1, 10.0]
tau_decay = [5.0, 60.0]
E_syn = [0.0, 0.0]
g_bar = [4.0, 0.5]
g_clip = [40.0, 4.0]

[recurrent.physiology.inhibitory]
tau_mem = 50.0
theta = -45.0
U_reset = -60.0
E_L = -60.0
g_L = 0.9
tau_ref = 8.0

[recurrent.synapses.inhibitory]
names = ["GABA_A"]
tau_rise = [0.5]
tau_decay = [6.0]
E_syn = [-70.0]
g_bar = [8.0]
g_clip = [80.0]

# ========================
# SCALING FACTORS
# ========================

[scaling_factors]
recurrent = [
    [1.0, 1.0],
    [1.0, 1.0],
]
feedforward = [
    [1.0, 1.0],
]
