# teacher-student — synthetic teacher-student experiments on conductance-based
# spiking networks. A *project* repo consuming the connectome-snns library as an
# editable path dependency (pin it to a git rev for archival reproducibility).
#
# Almost everything here trains spiking nets and needs torch. connectome-snns keeps
# torch in optional extras only (base install pulls none), so this repo owns the
# torch index choice itself (mirroring connectome-snns) to avoid uv's transitive
# conflicting-index error. Sync with the extra matching the machine:
#   uv sync --extra cu129     # GPU
#   uv sync --extra cpu       # CPU
#
# No [build-system] -> uv treats this as a virtual project.
[project]
name = "teacher-student"
version = "0.1.0"
description = "Synthetic teacher-student experiments on conductance-based spiking networks."
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["connectome-snns"]

[project.optional-dependencies]
cpu = ["torch>=2.7.0", "torchvision>=0.22.0"]
cu129 = ["torch>=2.7.0", "torchvision>=0.22.0", "cuml-cu12==26.2.*"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu129" }]]

[tool.uv.sources]
connectome-snns = { path = "../connectome-snns", editable = true }
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu129", extra = "cu129" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu129", extra = "cu129" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true
