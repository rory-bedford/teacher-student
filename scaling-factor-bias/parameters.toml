# Scaling-factor bias: are learnt scaling factors biased downward by TRAINING,
# rather than by the loss?
#
# The student uses the teacher's weights unperturbed, so scaling factors of 1.0
# are the true model and score a loss of zero — we measured that they reproduce
# the teacher spike for spike. Only the scaling factors train. Any drift below
# 1.0 is therefore an optimisation effect, not a property of the objective.
#
# The physiology below is IDENTICAL to the teacher's own parameters.toml, and
# must stay that way. If the student's synapse parameters differ from the
# teacher's, scaling factor 1.0 stops being the true model and the experiment is
# void. (An earlier version of this experiment drifted to mitral g_bar
# [4.0, 0.4] against the teacher's [6.0, 0.1], which invalidated it silently.)

[simulation]
seed = 44
# 15000 timesteps is not divisible by 160, so the final partial chunk of each
# pass through the data is dropped. Harmless: nothing here indexes the recording
# by chunk number.
chunk_size = 160
hidden_cell_fraction = 0.5

[training]
total_epochs = 10
chunks_per_update = 6
log_interval = 6
checkpoint_interval = 48
plot_size = 48
mixed_precision = true
burn_in_chunks = 20
# One scaling factor per cell-type pair for the whole network: layer 2 reuses
# layer 1's parameter for the pairs they share.
share_scaling_factors = true

[hyperparameters]
beta1 = 0.95
beta2 = 0.999
grad_norm_clip = 5.0
surrgrad_scale = 5.0
learning_rate = 8e-3
lr_min = 5e-4
van_rossum_tau_rise = 10.0
van_rossum_tau_decay = 100.0
loss_weight.van_rossum = 1.0

# ==========================================================================
# PHYSIOLOGY — copied verbatim from the teacher. Do not edit independently.
# ==========================================================================

[feedforward.cell_types]
names = ["mitral"]

[feedforward.synapses.mitral]
names = ["AMPA", "NMDA"]
tau_rise = [0.1, 10.0]
tau_decay = [5.0, 70.0]
E_syn = [0.0, 0.0]
g_bar = [6.0, 0.1]
g_clip = [40.0, 4.0]

[recurrent.cell_types]
names = ["excitatory", "inhibitory"]

[recurrent.physiology.excitatory]
tau_mem = 85.0
theta = -38.0
U_reset = -60.0
E_L = -60.0
g_L = 1.35
tau_ref = 8.0

[recurrent.synapses.excitatory]
names = ["AMPA", "NMDA"]
tau_rise = [0.1, 10.0]
tau_decay = [5.0, 60.0]
E_syn = [0.0, 0.0]
g_bar = [4.0, 0.5]
g_clip = [40.0, 4.0]

[recurrent.physiology.inhibitory]
tau_mem = 50.0
theta = -45.0
U_reset = -60.0
E_L = -60.0
g_L = 0.9
tau_ref = 8.0

[recurrent.synapses.inhibitory]
names = ["GABA_A"]
tau_rise = [0.5]
tau_decay = [6.0]
E_syn = [-70.0]
g_bar = [8.0]
g_clip = [80.0]
