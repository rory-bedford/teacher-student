# Full inference: combined student mismatch challenges.
# All challenges are independently toggleable via [student_mismatch].

# ========================
# SIMULATION CONFIGURATION
# ========================

[simulation]
seed = 45
chunk_size = 100

# ===========================
# STUDENT MISMATCH CHALLENGES
# ===========================

[student_mismatch]
hidden_fraction = 0.5          # fraction of remaining neurons that are unobserved (0.0 = all observed)
missing_unit_fraction = 0.1    # fraction of neurons structurally removed from student (0.0 = none)
noise_frac = 0.3               # multiplicative log-normal weight noise magnitude (0.0 = no noise)
input_type = "exact_spikes"    # "constant" | "latents" | "exact_spikes"
firing_rate_hz = 6.0           # uniform Poisson rate in Hz (only for input_type = "constant")

# ======================
# TRAINING CONFIGURATION
# ======================
#
# Scheduling, data degradation, and model constraints that define *what* is
# being trained. Optimiser hyperparameters live in [optimiser].

[training]
epochs = 500
weight_perturbation_variance = 0.5
burn_in_chunks = 50
chunks_per_update = 10
log_interval = 10
checkpoint_interval = 100
plot_size = 100
mixed_precision = true
ff_rank = 1                  # low-rank factorisation of the (n_ff, n_neurons) mitral block
ff_smoothing_tau = 100.0     # Gaussian sigma (ms) for FF input spike smoothing + Bernoulli resampling

# =========
# OPTIMISER
# =========
#
# How the trainable parameters move: FF weights (U, V, non-mitral rows) and
# recurrent scaling factors. Single grad-clip value applied to every group.

[optimiser]
lr_weights = 1e-3
lr_scaling = 1e-3
lr_min_weights = 5e-4
lr_min_scaling = 1e-4
grad_clip = 0.8
surrgrad_scale = 10.0

# ===============
# HYPERPARAMETERS
# ===============

[hyperparameters]
beta1 = 0.95
beta2 = 0.999
eps = 1e-4
van_rossum_tau_rise = 10.0
van_rossum_tau_decay = 100.0
loss_weight.van_rossum = 1.0
loss_weight.hidden_rate_mean = 0.5   # MSE on hidden population mean rate per cell type
loss_weight.hidden_rate_std = 0.5    # MSE on hidden population rate std per cell type
loss_weight.ff_matrix_l1 = 5000.0    # L1 penalty on exp(U @ V) — set >0 to enable

# ==========================
# FEEDFORWARD LAYER SYNAPSES
# ==========================

[feedforward.cell_types]
names = ["mitral"]

[feedforward.synapses.mitral]
names = ["AMPA", "NMDA"]
tau_rise = [0.1, 10.0]
tau_decay = [5.0, 70.0]
E_syn = [0.0, 0.0]
g_bar = [6.0, 0.1]
g_clip = [40.0, 4.0]

# =======================================
# RECURRENT LAYER PHYSIOLOGY AND SYNAPSES
# =======================================

[recurrent.cell_types]
names = ["excitatory", "inhibitory"]

[recurrent.physiology.excitatory]
tau_mem = 85.0
theta = -38.0
U_reset = -60.0
E_L = -60.0
g_L = 1.35
tau_ref = 8.0

[recurrent.synapses.excitatory]
names = ["AMPA", "NMDA"]
tau_rise = [0.1, 10.0]
tau_decay = [5.0, 60.0]
E_syn = [0.0, 0.0]
g_bar = [4.0, 0.5]
g_clip = [40.0, 4.0]

[recurrent.physiology.inhibitory]
tau_mem = 50.0
theta = -45.0
U_reset = -60.0
E_L = -60.0
g_L = 0.9
tau_ref = 8.0

[recurrent.synapses.inhibitory]
names = ["GABA_A"]
tau_rise = [0.5]
tau_decay = [6.0]
E_syn = [-70.0]
g_bar = [8.0]
g_clip = [80.0]

# ========================
# SCALING FACTORS
# ========================

[scaling_factors]
recurrent = [
    [1.0, 1.0],
    [1.0, 1.0],
]
feedforward = [
    [1.0, 1.0],
]
