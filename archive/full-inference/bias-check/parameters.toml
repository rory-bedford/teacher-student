# Parameters for the bias check — INFERENCE ONLY, no training.
#
# Deliberately minimal. Everything about the network being evaluated —
# physiology, synapses, chunk size, burn-in, the perturbation, the trained
# weights and the target scaling factors — is read from the reference run's own
# `parameters.toml`, `initial_state/`, `final_state/` and `targets/` snapshots,
# so the model evaluated here is the one that was trained. Duplicating those
# settings here would let the two silently diverge.

[bias_check]
# Batch elements of the teacher data to evaluate on (0 = all).
eval_batch_size = 0
# Chunks used for the loss, after the reference run's burn-in (0 = all remaining).
n_eval_chunks = 0
