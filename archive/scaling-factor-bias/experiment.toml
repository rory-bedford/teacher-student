output_dir = "/tachyon/groups/scratch/gzenke/bedfrory/dp-simulations/scaling-factor-bias/hidden-activity-0.5"
parameters_file = "/tachyon/groups/scratch/gzenke/bedfrory/teacher-student/scaling-factor-bias/parameters.toml"
log_file = "/tachyon/groups/scratch/gzenke/bedfrory/dp-simulations/Dp_simulator_log.jsonl"
description = "Two-layer student, 50% hidden activity, teacher's weights unperturbed. Only the scaling factors train, from 1.0 — which is the true model. Any drift below 1.0 is a training bias, not a loss bias."

[data]

# The teacher. Note these symlinks resolve by PATH: if teacher-activity is
# regenerated, this run's inputs silently become a different network. The
# physiology in parameters.toml is pinned to the CURRENT teacher, so check the
# teacher's metadata.json timestamp before trusting a comparison across runs.
[[data.inputs]]
path = "/tachyon/groups/scratch/gzenke/bedfrory/dp-simulations/teacher-activity/results/network_structure.npz"
strategy = "symlink"

[[data.inputs]]
path = "/tachyon/groups/scratch/gzenke/bedfrory/dp-simulations/teacher-activity/results/spike_data.zarr"
strategy = "symlink"

[wandb]
enabled = true
project = "scaling-factor-bias"
name = "hidden-activity-0.5"
entity = ""
tags = ["scaling-factor-bias", "hidden-activity", "two-layer", "unperturbed-weights"]
notes = "Scaling factors start at the true value (1.0) with correct weights. Watching whether training moves them down."
